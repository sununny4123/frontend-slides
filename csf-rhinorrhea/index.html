<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Slides are authored at 1920x1080 and scaled as a whole.
   =========================================== */
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--stage-bg,#000); }
.deck-viewport { position:fixed; inset:0; overflow:hidden; background:var(--stage-bg,#000); }
.deck-stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; transform-origin:0 0; background:var(--slide-bg,#fff); }
.slide { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; display:block; visibility:hidden; opacity:0; pointer-events:none; background:var(--slide-bg,#fff); }
.slide.active, .slide.visible { visibility:visible; opacity:1; pointer-events:auto; z-index:1; }
img, video, canvas, svg { max-width:100%; max-height:100%; }
.deck-controls { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:1000; }
@media print {
  html, body { width:1920px; height:auto; overflow:visible; background:#fff; }
  .deck-viewport { position:static; overflow:visible; background:#fff; }
  .deck-stage { position:static; width:auto; height:auto; transform:none !important; background:none; }
  .slide { position:relative; display:block !important; visibility:visible !important; opacity:1 !important; pointer-events:auto !important; width:1920px; height:1080px; break-after:page; page-break-after:always; }
  .slide:last-child { break-after:auto; page-break-after:auto; }
  .deck-controls { display:none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.2s !important; }
}

/* ===========================================
   DESIGN SYSTEM — "Clinical Aurora" (light)
   =========================================== */
:root{
  --violet:#5B34E8;   --violet-2:#7A4BF6;  --indigo:#3524A8;
  --orchid:#B23CE8;   --rose:#E4529B;      --cyan:#12B5D6;
  --amber:#F08A2E;    --mint:#12B37A;

  --ink:#14112A;      --ink-2:#3D3757;     --muted:#7A7496;   --faint:#A8A3BE;
  --bg:#F3F1FA;       --card:#FFFFFF;      --card-2:#FAF9FE;
  --line:rgba(30,18,90,.11);  --line-2:rgba(30,18,90,.07);
  --stage-bg:#DEDBEC;  --slide-bg:var(--bg);

  --grad: linear-gradient(135deg,#6A38F2 0%, #8B3BF0 38%, #C246DC 68%, #5B7CF7 100%);
  --grad-soft: linear-gradient(135deg,rgba(106,56,242,.14),rgba(194,70,220,.12));
  --shadow-sm: 0 2px 8px rgba(31,17,88,.05), 0 1px 2px rgba(31,17,88,.04);
  --shadow: 0 18px 44px -22px rgba(41,20,110,.34), 0 3px 12px rgba(41,20,110,.06);
  --shadow-lg: 0 42px 90px -40px rgba(41,20,110,.46), 0 8px 26px rgba(41,20,110,.08);
  --r-sm:12px; --r:18px; --r-lg:26px; --r-xl:34px;
  --fs:1;
  --f-display:'Outfit','Outfit Fallback',ui-sans-serif,system-ui,sans-serif;
  --f-body:'IBM Plex Sans','IBM Plex Sans Fallback',ui-sans-serif,system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{ box-sizing:border-box; }
body{ font-family:var(--f-body); color:var(--ink); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
.slide{ background:var(--bg); }

/* ---------- atmosphere ---------- */
.bloom{ position:absolute; border-radius:50%; filter:blur(90px); pointer-events:none; opacity:.55; z-index:0; }
.bloom.v{ background:radial-gradient(circle,#7B45F5 0%,rgba(123,69,245,0) 70%); }
.bloom.o{ background:radial-gradient(circle,#C246DC 0%,rgba(194,70,220,0) 70%); }
.bloom.c{ background:radial-gradient(circle,#3FA9F5 0%,rgba(63,169,245,0) 70%); }
.grain{ position:absolute; inset:0; pointer-events:none; z-index:1; opacity:.5;
  background-image:radial-gradient(rgba(60,40,140,.05) 1px, transparent 1px); background-size:3px 3px; }
.hairlines{ position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:linear-gradient(to right, var(--line-2) 1px, transparent 1px);
  background-size:160px 100%; }

/* ---------- slide frame ---------- */
.pad{ position:absolute; inset:0; padding:76px 96px 74px; z-index:2; display:flex; flex-direction:column; }
.eyebrow{ font-family:var(--f-mono); font-size:calc(15px*var(--fs)); font-weight:500; letter-spacing:.3em;
  text-transform:uppercase; color:var(--violet); display:flex; align-items:center; gap:14px; }
.eyebrow::before{ content:''; width:26px; height:2px; background:var(--grad); border-radius:2px; }
h1,h2,h3,h4{ margin:0; font-family:var(--f-display); font-weight:300; letter-spacing:-.02em; line-height:1.06; color:var(--ink); }
.s-title{ font-size:calc(62px*var(--fs)); margin-top:18px; }
.s-title.sm{ font-size:calc(50px*var(--fs)); }
.s-title strong{ font-weight:600; }
.s-title em{ font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.s-sub{ font-size:calc(24px*var(--fs)); color:var(--ink-2); font-weight:300; margin-top:16px; max-width:1180px; line-height:1.5; }
.cite{ position:absolute; left:96px; right:600px; bottom:34px; font-size:calc(15px*var(--fs)); color:var(--faint);
  font-family:var(--f-mono); letter-spacing:.01em; z-index:3; display:flex; gap:10px; align-items:flex-start; }
.cite::before{ content:'▪'; color:var(--orchid); font-size:11px; line-height:1.6; }
.body-area{ flex:1; min-height:0; display:flex; gap:44px; margin-top:38px; }

/* ---------- cards & primitives ---------- */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:30px 32px; position:relative; overflow:hidden; }
.card.tint{ background:linear-gradient(160deg,#fff, #F7F4FF); }
.card.grad{ background:var(--grad); border-color:transparent; color:#fff; box-shadow:var(--shadow); }
.card.grad h3,.card.grad h4,.card.grad .k{ color:#fff; }
.card.grad .card-body{ color:rgba(255,255,255,.9); }
.card-head{ display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.card h3{ font-size:calc(27px*var(--fs)); font-weight:500; }
.card h4{ font-size:calc(21px*var(--fs)); font-weight:500; font-family:var(--f-body); letter-spacing:0; }
.card-body{ font-size:calc(19px*var(--fs)); line-height:1.55; color:var(--ink-2); }
.chip{ display:inline-flex; align-items:center; gap:8px; padding:7px 15px; border-radius:999px; font-family:var(--f-mono);
  font-size:calc(14px*var(--fs)); letter-spacing:.08em; text-transform:uppercase; background:rgba(91,52,232,.09); color:var(--violet); border:1px solid rgba(91,52,232,.16); }
.chip.warn{ background:rgba(240,138,46,.12); color:#B4620F; border-color:rgba(240,138,46,.25); }
.chip.good{ background:rgba(18,179,122,.12); color:#0B7A52; border-color:rgba(18,179,122,.24); }
.chip.solid{ background:var(--grad); color:#fff; border-color:transparent; }
.ico{ width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:var(--grad-soft);
  border:1px solid rgba(91,52,232,.14); color:var(--violet); flex:none; }
.ico svg{ width:24px; height:24px; }
.card.grad .ico{ background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.3); color:#fff; }

/* bullet lists */
ul.bul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px;
  height:100%; justify-content:flex-start; justify-content:safe center; }
ul.bul > li{ position:relative; padding-left:32px; font-size:calc(21px*var(--fs)); line-height:1.5; color:var(--ink-2); }
ul.bul > li::before{ content:''; position:absolute; left:6px; top:.62em; width:9px; height:9px; border-radius:3px;
  background:var(--grad); transform:rotate(45deg); }
ul.bul > li strong{ color:var(--ink); font-weight:600; }
ul.bul ul{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
ul.bul ul li{ position:relative; padding-left:22px; font-size:calc(18px*var(--fs)); color:var(--muted); line-height:1.45; }
ul.bul ul li::before{ content:''; position:absolute; left:2px; top:.62em; width:7px; height:2px; background:var(--faint); }
.dense ul.bul > li{ font-size:calc(19px*var(--fs)); gap:10px; }
.dense ul.bul{ gap:11px; }

/* ---------- device / scope frame (reference deck's phone mockup, re-cast as a scope monitor) ---------- */
.scope{ position:relative; border-radius:44px; padding:14px; background:linear-gradient(160deg,#ffffff,#EDE9FB);
  border:1px solid var(--line); box-shadow:var(--shadow-lg); }
.scope::before{ content:''; position:absolute; left:50%; top:22px; transform:translateX(-50%); width:104px; height:8px;
  border-radius:99px; background:rgba(30,18,90,.13); z-index:3; }
.scope-in{ position:relative; border-radius:32px; overflow:hidden; background:#100C22; height:100%; }
.scope-in img, .scope-in video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; max-width:none; max-height:none; display:block; }
.scope-in video{ object-fit:contain; background:#0C0820; }
.scope.glow::after{ content:''; position:absolute; inset:-40px; border-radius:60px; background:var(--grad); filter:blur(60px); opacity:.22; z-index:-1; }

/* figure cards */
.fig{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; position:relative; cursor:zoom-in; transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s; }
.fig:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
.fig .frame{ flex:1; min-height:0; position:relative; overflow:hidden;
  background:linear-gradient(150deg,#FBFAFF,#F3F0FB); }
.fig .frame img{ position:absolute; inset:10px; width:calc(100% - 20px); height:calc(100% - 20px);
  object-fit:contain; max-width:none; max-height:none; }
.fig.crop .frame img{ inset:0; width:100%; height:100%; }
.fig.crop .frame img{ object-fit:cover; }
.fig figcaption{ padding:12px 16px 14px; font-size:calc(16px*var(--fs)); line-height:1.4; color:var(--muted);
  border-top:1px solid var(--line-2); background:var(--card-2); }
.fig figcaption b{ color:var(--ink-2); font-weight:600; }
.fig .zoom-hint{ position:absolute; right:10px; top:10px; width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
  background:rgba(255,255,255,.86); border:1px solid var(--line); color:var(--violet); opacity:0; transition:opacity .2s; backdrop-filter:blur(6px); }
.fig:hover .zoom-hint{ opacity:1; }

/* ---------- stat ---------- */
.stat-num{ font-family:var(--f-display); font-weight:200; font-size:calc(210px*var(--fs)); line-height:.86; letter-spacing:-.05em;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.stat-num.sm{ font-size:calc(128px*var(--fs)); }
.stat-lab{ font-family:var(--f-mono); font-size:calc(16px*var(--fs)); letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-top:10px; }

/* ---------- comparison matrix ---------- */
.matrix{ width:100%; border-collapse:separate; border-spacing:0; font-size:calc(18px*var(--fs)); }
.matrix th, .matrix td{ padding:15px 18px; text-align:left; vertical-align:middle; border-bottom:1px solid var(--line-2); }
.matrix thead th{ font-family:var(--f-mono); font-size:calc(14px*var(--fs)); letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); font-weight:500; border-bottom:1px solid var(--line); padding-bottom:14px; }
.matrix tbody td{ color:var(--ink-2); }
.matrix tbody tr td:first-child{ color:var(--ink); font-weight:500; }
.matrix .hi{ position:relative; color:#fff !important; }
.matrix thead th.hi, .matrix tbody td.hi{ background:var(--grad); }
.matrix thead th.hi{ border-radius:16px 16px 0 0; color:#fff; border-bottom-color:rgba(255,255,255,.24); }
.matrix tbody tr:last-child td.hi{ border-radius:0 0 16px 16px; border-bottom-color:transparent; }
.matrix td.c{ text-align:center; }
.matrix .dot{ width:9px; height:9px; border-radius:50%; background:var(--faint); display:inline-block; }
.matrix .hi .dot{ background:rgba(255,255,255,.55); }
.matrix svg.tick{ width:22px; height:22px; color:var(--violet); }
.matrix .hi svg.tick{ color:#fff; }

/* ---------- steps / timeline ---------- */
.steps{ display:flex; gap:18px; }
.step{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:24px 22px; position:relative; box-shadow:var(--shadow-sm); }
.step .n{ font-family:var(--f-mono); font-size:calc(13px*var(--fs)); letter-spacing:.16em; color:var(--violet); }
.step h4{ font-size:calc(20px*var(--fs)); margin:10px 0 8px; font-family:var(--f-display); font-weight:500; }
.step p{ margin:0; font-size:calc(16px*var(--fs)); line-height:1.45; color:var(--muted); }
.step::after{ content:''; position:absolute; right:-13px; top:50%; width:8px; height:8px; border-top:2px solid var(--faint);
  border-right:2px solid var(--faint); transform:translateY(-50%) rotate(45deg); }
.step:last-child::after{ display:none; }

/* ---------- evidence card (reference deck's testimonial card) ---------- */
.ev{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:26px 28px; box-shadow:var(--shadow-sm); }
.ev .ev-h{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.ev .grade{ font-family:var(--f-mono); font-weight:600; font-size:calc(15px*var(--fs)); padding:6px 12px; border-radius:9px;
  background:var(--grad); color:#fff; letter-spacing:.06em; }
.ev dl{ margin:0; display:flex; flex-direction:column; gap:11px; }
.ev dt{ font-family:var(--f-mono); font-size:calc(13px*var(--fs)); letter-spacing:.16em; text-transform:uppercase; color:var(--violet); }
.ev dd{ margin:3px 0 0; font-size:calc(18px*var(--fs)); line-height:1.45; color:var(--ink-2); }

/* ---------- title & section ---------- */
.hero-title{ font-size:calc(128px*var(--fs)); font-weight:200; line-height:.98; letter-spacing:-.035em; }
.hero-title b{ font-weight:600; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sect-num{ font-family:var(--f-display); font-weight:200; font-size:calc(300px*var(--fs)); line-height:.8; letter-spacing:-.06em;
  color:transparent; -webkit-text-stroke:2px rgba(91,52,232,.3); }
.rule{ height:1px; background:linear-gradient(90deg,var(--line),transparent); margin:26px 0; }

/* ---------- interactive widgets ---------- */
.hot-wrap{ position:relative; }
.hot{ position:absolute; width:34px; height:34px; border-radius:50%; border:2px solid #fff; background:var(--grad);
  cursor:pointer; display:grid; place-items:center; color:#fff; font-family:var(--f-mono); font-size:13px; font-weight:600;
  box-shadow:0 6px 18px rgba(60,20,150,.4); transition:transform .2s; z-index:4; }
.hot:hover, .hot.on{ transform:scale(1.18); }
.hot::after{ content:''; position:absolute; inset:-8px; border-radius:50%; border:2px solid rgba(91,52,232,.4); animation:ping 2.4s ease-out infinite; }
@keyframes ping{ 0%{ transform:scale(.7); opacity:.9 } 100%{ transform:scale(1.5); opacity:0 } }

.flip{ perspective:1400px; cursor:pointer; }
.flip-in{ position:relative; width:100%; height:100%; transition:transform .7s cubic-bezier(.3,.8,.3,1); transform-style:preserve-3d; }
.flip.on .flip-in{ transform:rotateY(180deg); }
.flip-f, .flip-b{ position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--r-lg); padding:28px 30px;
  display:flex; flex-direction:column; justify-content:center; }
.flip-f{ background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow-sm); }
.flip-b{ background:var(--grad); color:#fff; transform:rotateY(180deg); box-shadow:var(--shadow); }
.flip-b .card-body{ color:rgba(255,255,255,.94); }

.cmp{ position:relative; overflow:hidden; border-radius:var(--r); cursor:ew-resize; user-select:none; background:#0E0A1E; }
.cmp img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; max-width:none; max-height:none; }
.cmp .top{ clip-path:inset(0 50% 0 0); }
.cmp .handle{ position:absolute; top:0; bottom:0; left:50%; width:3px; background:#fff; box-shadow:0 0 14px rgba(0,0,0,.5); z-index:3; }
.cmp .handle::after{ content:'⇄'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:44px; height:44px;
  border-radius:50%; background:#fff; color:var(--violet); display:grid; place-items:center; font-size:20px; box-shadow:0 4px 16px rgba(0,0,0,.3); }
.cmp .lab{ position:absolute; bottom:14px; font-family:var(--f-mono); font-size:14px; letter-spacing:.1em; text-transform:uppercase;
  background:rgba(10,6,26,.72); color:#fff; padding:6px 12px; border-radius:8px; z-index:4; backdrop-filter:blur(6px); }

.tree-node{ border:1px solid var(--line); border-radius:var(--r); padding:18px 22px; background:var(--card); cursor:pointer;
  transition:all .25s; box-shadow:var(--shadow-sm); }
.tree-node:hover{ border-color:rgba(91,52,232,.4); transform:translateY(-2px); }
.tree-node.on{ background:var(--grad); color:#fff; border-color:transparent; box-shadow:var(--shadow); }
.tree-node.on .tn-sub{ color:rgba(255,255,255,.85); }
.tn-t{ font-family:var(--f-display); font-size:calc(22px*var(--fs)); font-weight:500; }
.tn-sub{ font-size:calc(16px*var(--fs)); color:var(--muted); margin-top:5px; line-height:1.4; }

.seg{ display:inline-flex; background:rgba(91,52,232,.07); border:1px solid var(--line); border-radius:999px; padding:5px; gap:4px; }
.seg button{ font-family:var(--f-mono); font-size:calc(15px*var(--fs)); letter-spacing:.06em; text-transform:uppercase;
  padding:9px 18px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; transition:all .2s; }
.seg button.on{ background:var(--grad); color:#fff; box-shadow:0 4px 14px rgba(91,52,232,.3); }
.seg button:hover:not(.on){ color:var(--violet); }

.layers{ display:flex; flex-direction:column-reverse; gap:8px; }
.layer{ border-radius:14px; padding:16px 20px; display:flex; align-items:center; gap:16px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); transition:all .25s; box-shadow:var(--shadow-sm); }
.layer:hover{ transform:translateX(6px); }
.layer.on{ background:var(--grad); color:#fff; border-color:transparent; }
.layer.on .l-sub{ color:rgba(255,255,255,.86); }
.l-n{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-family:var(--f-mono); font-weight:600;
  background:rgba(91,52,232,.1); color:var(--violet); flex:none; font-size:15px; }
.layer.on .l-n{ background:rgba(255,255,255,.2); color:#fff; }
.l-t{ font-size:calc(19px*var(--fs)); font-weight:500; }
.l-sub{ font-size:calc(15px*var(--fs)); color:var(--muted); margin-top:2px; }

/* reveal animation */
.rv{ opacity:0; transform:translateY(18px); }
.slide.active .rv{ animation:rvIn .7s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes rvIn{ to{ opacity:1; transform:none } }
.slide.active .rv:nth-child(1){ animation-delay:.05s } .slide.active .rv:nth-child(2){ animation-delay:.12s }
.slide.active .rv:nth-child(3){ animation-delay:.19s } .slide.active .rv:nth-child(4){ animation-delay:.26s }
.slide.active .rv:nth-child(5){ animation-delay:.33s } .slide.active .rv:nth-child(6){ animation-delay:.4s }
.slide.active .rv:nth-child(7){ animation-delay:.47s } .slide.active .rv:nth-child(8){ animation-delay:.54s }
.slide.active .rv:nth-child(9){ animation-delay:.61s } .slide.active .rv:nth-child(n+10){ animation-delay:.68s }

/* ===========================================
   DECK CHROME (outside the 1920x1080 design system)
   =========================================== */
.chrome{ position:fixed; z-index:1000; font-family:var(--f-body); }
.hud{ left:0; right:0; bottom:0; height:64px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; pointer-events:none; transition:opacity .45s ease, transform .45s ease; }
body.idle .hud{ opacity:0; transform:translateY(10px); pointer-events:none; }
body.idle .hud > *{ pointer-events:none; }
body.idle .progress{ opacity:.45; }
.progress{ transition:opacity .45s ease; }
.hud > *{ pointer-events:auto; }
.pill{ display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.82); backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(30,18,90,.1); border-radius:999px; padding:6px; box-shadow:0 8px 30px -12px rgba(41,20,110,.4); }
.ib{ width:38px; height:38px; border-radius:999px; border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  display:grid; place-items:center; transition:all .18s; position:relative; }
.ib:hover{ background:rgba(91,52,232,.1); color:var(--violet); }
.ib.on{ background:var(--grad); color:#fff; }
.ib svg{ width:19px; height:19px; }
.ib[data-tip]:hover::after{ content:attr(data-tip); position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%);
  background:#1A1430; color:#fff; font-size:11.5px; font-family:var(--f-mono); letter-spacing:.04em; padding:6px 10px; border-radius:7px;
  white-space:nowrap; pointer-events:none; }
.counter{ font-family:var(--f-mono); font-size:13px; color:var(--muted); padding:0 12px; letter-spacing:.06em; white-space:nowrap; }
.counter b{ color:var(--ink); font-weight:600; }
.progress{ position:fixed; left:0; top:0; height:3px; width:100%; background:rgba(30,18,90,.08); z-index:1001; }
.progress i{ display:block; height:100%; width:0; background:var(--grad); transition:width .45s cubic-bezier(.2,.7,.3,1); }
.sec-label{ font-family:var(--f-mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
  padding:0 14px; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* panels */
.panel{ position:fixed; top:0; bottom:0; width:400px; background:rgba(252,251,255,.97); backdrop-filter:blur(20px);
  z-index:1200; display:flex; flex-direction:column; transition:transform .38s cubic-bezier(.3,.8,.3,1); }
.panel.left{ left:0; border-right:1px solid var(--line); transform:translateX(-101%); box-shadow:26px 0 60px -30px rgba(41,20,110,.4); }
.panel.right{ right:0; width:460px; border-left:1px solid var(--line); transform:translateX(101%); box-shadow:-26px 0 60px -30px rgba(41,20,110,.4); }
.panel.open{ transform:none; }
.panel-h{ padding:20px 22px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
.panel-h h5{ margin:0; font-family:var(--f-display); font-size:19px; font-weight:500; }
.panel-b{ flex:1; overflow-y:auto; padding:16px 18px 30px; }
.panel-b::-webkit-scrollbar{ width:9px } .panel-b::-webkit-scrollbar-thumb{ background:rgba(91,52,232,.22); border-radius:9px }

.toc-sec{ font-family:var(--f-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--violet);
  margin:20px 0 8px; padding-left:10px; }
.toc-sec:first-child{ margin-top:4px; }
.toc-i{ display:flex; gap:12px; align-items:baseline; padding:9px 12px; border-radius:11px; cursor:pointer; transition:all .16s; font-size:14.5px; color:var(--ink-2); line-height:1.35; }
.toc-i:hover{ background:rgba(91,52,232,.08); color:var(--violet); }
.toc-i.on{ background:var(--grad); color:#fff; }
.toc-i .n{ font-family:var(--f-mono); font-size:11.5px; opacity:.65; flex:none; width:24px; }

/* overview grid */
.ov{ position:fixed; inset:0; z-index:1300; background:rgba(238,236,248,.96); backdrop-filter:blur(22px); display:none;
  overflow-y:auto; padding:78px 34px 44px; }
.ov.open{ display:block; }
.ov-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:20px; max-width:1720px; margin:0 auto; }
.ov-c{ cursor:pointer; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#fff; transition:all .22s; box-shadow:var(--shadow-sm); }
.ov-c:hover{ transform:translateY(-4px); box-shadow:var(--shadow); border-color:rgba(91,52,232,.4); }
.ov-c.on{ outline:2.5px solid var(--violet); outline-offset:2px; }
.ov-t{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:var(--bg); }
.ov-t .mini{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; pointer-events:none; }
.ov-m{ padding:9px 12px; font-size:12.5px; color:var(--ink-2); display:flex; gap:9px; align-items:baseline; border-top:1px solid var(--line-2); }
.ov-m .n{ font-family:var(--f-mono); font-size:11px; color:var(--faint); }
.ov-h{ position:fixed; left:0; right:0; top:0; height:66px; display:flex; align-items:center; gap:14px; padding:0 26px;
  background:rgba(246,244,252,.9); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); z-index:2; }
.ov-h h5{ margin:0; font-family:var(--f-display); font-size:20px; font-weight:500; }

/* search */
.srch{ position:fixed; inset:0; z-index:1400; background:rgba(24,16,60,.34); backdrop-filter:blur(8px); display:none; padding-top:12vh; }
.srch.open{ display:block; }
.srch-box{ width:min(760px,92vw); margin:0 auto; background:#fff; border-radius:20px; box-shadow:var(--shadow-lg); overflow:hidden; border:1px solid var(--line); }
.srch-box input{ width:100%; border:0; padding:24px 26px; font-size:20px; font-family:var(--f-body); outline:0; color:var(--ink); background:transparent; }
.srch-res{ max-height:52vh; overflow-y:auto; border-top:1px solid var(--line); }
.sr{ padding:14px 26px; cursor:pointer; border-bottom:1px solid var(--line-2); transition:background .15s; }
.sr:hover, .sr.on{ background:rgba(91,52,232,.07); }
.sr .t{ font-size:15.5px; color:var(--ink); font-weight:500; }
.sr .c{ font-size:13px; color:var(--muted); margin-top:3px; line-height:1.4; }
.sr mark{ background:rgba(194,70,220,.22); color:var(--indigo); border-radius:3px; padding:0 2px; }
.sr .n{ font-family:var(--f-mono); font-size:11px; color:var(--violet); letter-spacing:.1em; }

/* lightbox */
.lb{ position:fixed; inset:0; z-index:1500; background:rgba(16,10,38,.93); display:none; }
.lb.open{ display:block; }
.lb-stage{ position:absolute; inset:0; overflow:hidden; cursor:grab; }
.lb-stage.drag{ cursor:grabbing; }
.lb-stage img{ position:absolute; left:50%; top:50%; transform-origin:center; max-width:none; max-height:none; will-change:transform; }
.lb-cap{ position:fixed; left:0; right:0; bottom:0; padding:20px 30px 24px; background:linear-gradient(transparent,rgba(10,6,26,.9));
  color:rgba(255,255,255,.9); font-size:15px; line-height:1.5; text-align:center; }
.lb-cap b{ color:#fff; }
.lb-bar{ position:fixed; top:16px; right:18px; display:flex; gap:6px; }
.lb-bar .ib{ background:rgba(255,255,255,.12); color:#fff; }
.lb-bar .ib:hover{ background:rgba(255,255,255,.26); }
.lb-nav{ position:fixed; top:50%; transform:translateY(-50%); width:52px; height:52px; border-radius:50%; border:0;
  background:rgba(255,255,255,.14); color:#fff; cursor:pointer; display:grid; place-items:center; }
.lb-nav:hover{ background:rgba(255,255,255,.3); }
.lb-nav.prev{ left:20px } .lb-nav.next{ right:20px }

/* notes */
.notes{ position:fixed; left:16px; bottom:76px; width:400px; max-height:38vh; overflow-y:auto; background:rgba(255,255,255,.95);
  border:1px solid var(--line); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); z-index:999; display:none;
  font-size:14.5px; line-height:1.55; color:var(--ink-2); backdrop-filter:blur(14px); }
.notes.open{ display:block; }
.notes h6{ margin:0 0 8px; font-family:var(--f-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--violet); }

/* toast */
.toast{ position:fixed; left:50%; bottom:84px; transform:translate(-50%,20px); background:#1A1430; color:#fff; padding:12px 22px;
  border-radius:12px; font-size:14px; z-index:1600; opacity:0; pointer-events:none; transition:all .3s; box-shadow:var(--shadow-lg); }
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* ===========================================
   REAL-TIME EDITOR
   =========================================== */
body.editing .slide [data-edit]{ outline:1.5px dashed rgba(91,52,232,.34); outline-offset:5px; border-radius:5px; transition:outline-color .2s, background .2s; cursor:text; }
body.editing .slide [data-edit]:hover{ outline-color:var(--violet); background:rgba(91,52,232,.05); }
body.editing .slide [data-edit]:focus{ outline:2px solid var(--violet); background:rgba(91,52,232,.06); }
body.editing .fig{ cursor:default; }
.edit-badge{ position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:1100; background:var(--grad); color:#fff;
  font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; padding:8px 18px; border-radius:999px;
  box-shadow:var(--shadow); display:none; align-items:center; gap:10px; }
body.editing .edit-badge{ display:flex; }
.edit-badge .dot{ width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1.6s infinite; }
@keyframes blink{ 50%{ opacity:.25 } }

.ed-sec{ margin-bottom:20px; }
.ed-sec > label{ display:block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--violet); margin-bottom:8px; }
.ed-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.ed-in, .ed-ta, .ed-sel{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:var(--f-body);
  font-size:14px; color:var(--ink); background:#fff; outline:0; transition:border-color .18s, box-shadow .18s; }
.ed-in:focus, .ed-ta:focus, .ed-sel:focus{ border-color:var(--violet); box-shadow:0 0 0 3px rgba(91,52,232,.12); }
.ed-ta{ resize:vertical; min-height:92px; line-height:1.5; font-size:13.5px; }
.ed-btn{ border:1px solid var(--line); background:#fff; color:var(--ink-2); border-radius:10px; padding:9px 14px; font-size:13px;
  font-family:var(--f-body); cursor:pointer; transition:all .18s; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.ed-btn:hover{ border-color:var(--violet); color:var(--violet); background:rgba(91,52,232,.05); }
.ed-btn.pri{ background:var(--grad); color:#fff; border-color:transparent; }
.ed-btn.pri:hover{ filter:brightness(1.08); color:#fff; }
.ed-btn.danger:hover{ border-color:#E0446B; color:#E0446B; background:rgba(224,68,107,.06); }
.ed-btn svg{ width:15px; height:15px; }
.ed-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ed-hint{ font-size:12px; color:var(--muted); line-height:1.5; margin:6px 0 0; }
.sw-row{ display:flex; gap:9px; flex-wrap:wrap; }
.sw{ width:34px; height:34px; border-radius:11px; border:2px solid transparent; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .16s; }

.ed-list{ display:flex; flex-direction:column; gap:5px; }
.ed-item{ display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:10px;
  background:#fff; font-size:13px; cursor:grab; transition:all .16s; }
.ed-item:hover{ border-color:rgba(91,52,232,.4); }
.ed-item.on{ background:var(--grad); color:#fff; border-color:transparent; }
.ed-item.drag-over{ border-color:var(--violet); border-style:dashed; }
.ed-item .n{ font-family:var(--f-mono); font-size:11px; opacity:.7; width:22px; flex:none; }
.ed-item .t{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ed-item .x{ opacity:0; border:0; background:transparent; cursor:pointer; color:inherit; font-size:15px; line-height:1; padding:2px 4px; }

.rng{ width:100%; accent-color:var(--violet); }
.ed-tabs{ display:flex; gap:4px; padding:4px; background:rgba(91,52,232,.07); border-radius:12px; margin-bottom:16px; }
.ed-tabs button{ flex:1; border:0; background:transparent; padding:8px 6px; border-radius:9px; font-size:12.5px; font-family:var(--f-body);

.ed-tabs button.on{ background:#fff; color:var(--violet); font-weight:600; box-shadow:var(--shadow-sm); }
.ed-pane{ display:none } .ed-pane.on{ display:block }
.asset-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-height:250px; overflow-y:auto; padding:3px; }
.asset-grid img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:2px solid transparent; cursor:pointer; background:#fff; }
.asset-grid img:hover{ border-color:var(--violet); }

    {q:"Cribriform plate versus ethmoid roof — where does the graft go?", a:"Ethmoid roof bone is thick, so the graft may be placed underlay. Cribriform plate and olfactory cleft bone is thin, so the graft should be placed overlay — an underlay can further disrupt the bone."},

/* Pick the grid shape that shows the pictures largest.
   Rather than guessing from orientation, try every plausible cols x rows
   arrangement inside the available box and keep the one that maximises the
   total displayed image area. */
const GAP = 16, CAPTION = 64;
function bestGrid(figs, W, H){
  const n = figs.length;
  if (!n) return { cols:'1fr', rows:'1fr', score:0 };
  if (n === 1) return { cols:'1fr', rows:'1fr', score:1 };
  let best = null;
  for (let cols = 1; cols <= Math.min(5, n); cols++){
    const rows = Math.ceil(n / cols);
    if (rows > 3) continue;
    const sw = (W - GAP*(cols-1)) / cols;
    const sh = (H - GAP*(rows-1)) / rows - CAPTION;
    if (sw < 120 || sh < 100) continue;
    let area = 0;
    figs.forEach(f => {
      const a = aspectOf(f.src);                 // height / width
      const k = Math.min(sw, sh / a);            // rendered width
      area += k * k * a;
    });
    // a mild penalty for leaving empty cells in the last row
    area *= 1 - 0.05 * (cols*rows - n);
    if (!best || area > best.score) best = { cols:'1fr '.repeat(cols).trim(), rows:'1fr '.repeat(rows).trim(), score:area };
  }
  return best || { cols:'1fr', rows:'1fr', score:0 };
}

/* =========================================================
   DECK ENGINE — scaling, navigation, chrome, widgets
   ========================================================= */
const $  = (q,r)=> (r||document).querySelector(q);
const $$ = (q,r)=> Array.from((r||document).querySelectorAll(q));
const stage = $('#stage'), viewport = $('#viewport');
let cur = 0, slides = [];

function fit(){
  const w = viewport.clientWidth, h = viewport.clientHeight;
  const k = Math.min(w/1920, h/1080);
  stage.style.transform = `translate(${(w-1920*k)/2}px, ${(h-1080*k)/2}px) scale(${k})`;
}
addEventListener('resize', fit);

function mount(keep){
  const at = keep ? cur : 0;
  stage.innerHTML = DECK.slides.map(renderSlide).join('');
  slides = $$('.slide', stage);
  $('#cAll').textContent = DECK.slides.length;
  buildToc(); buildOverview();
  wireSlides();
  cur = Math.min(at, slides.length-1);
  show(cur, true);
  fit();
  if (document.body.classList.contains('editing')) armEditables();
}

function show(i, silent){
  if (i < 0 || i >= slides.length) return;
  slides.forEach(el => el.classList.remove('active'));
  cur = i;
  const el = slides[i];
  el.classList.add('active');
  // restart entrance animations
  $$('.rv', el).forEach(n => { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; });
  $$('video', stage).forEach(v => { if (!el.contains(v)) v.pause(); });
  const s = DECK.slides[i];
  $('#cNow').textContent = i+1;
  $('#secLabel').textContent = s.sec || '';
  $('#pbar').style.width = ((i+1)/slides.length*100)+'%';
  $('#notesBody').innerHTML = s.notes || '<i style="color:var(--faint)">No notes for this slide.</i>';
  $$('.toc-i').forEach(n => n.classList.toggle('on', +n.dataset.i === i));
  $$('.ov-c').forEach(n => n.classList.toggle('on', +n.dataset.i === i));
  if (!silent) location.hash = 's'+(i+1);
  if (document.body.classList.contains('editing')){ disarmEditables(); armEditables(); }
  if (edOpen) renderSlidePane();
}
const next = () => show(Math.min(cur+1, slides.length-1));
const prev = () => show(Math.max(cur-1, 0));

/* ---------- contents ---------- */
function buildToc(){
  let html = '', last = null;
  DECK.slides.forEach((s,i)=>{
    if (s.sec !== last){ html += `<div class="toc-sec">${s.sec||''}</div>`; last = s.sec; }
    const t = (s.title||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&');
    html += `<div class="toc-i" data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${t||'—'}</span></div>`;
  });
  $('#tocBody').innerHTML = html;
  $$('.toc-i').forEach(n => n.onclick = () => { show(+n.dataset.i); closeAll(); });
}

/* ---------- overview (live mini renders) ---------- */
function buildOverview(){
  $('#ovGrid').innerHTML = DECK.slides.map((s,i)=>{
    const t = (s.title||'').replace(/<[^>]+>/g,'');
    return `<div class="ov-c" data-i="${i}"><div class="ov-t"><div class="mini" data-mini="${i}"></div></div>
      <div class="ov-m"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${t||'—'}</span></div></div>`;
  }).join('');
  $('#ovCount').innerHTML = `<b>${DECK.slides.length}</b> slides`;
  $$('.ov-c').forEach(n => n.onclick = () => { show(+n.dataset.i); closeAll(); });
}
let ovBuilt = false;
function paintOverview(){
  $$('.mini').forEach(m => {
    const i = +m.dataset.mini;
    if (!m.firstChild){
      const src = slides[i];
      if (src) m.innerHTML = src.innerHTML;

/* ---------- search ---------- */
function slideText(s){
  const bits = [];
  (function walk(v){
    if (v == null) return;
    if (typeof v === 'string') { bits.push(v.replace(/<[^>]+>/g,' ')); return; }
    if (Array.isArray(v)) return v.forEach(walk);
    if (typeof v === 'object') return Object.entries(v).forEach(([k,x]) => { if (k!=='src'&&k!=='layout'&&k!=='video') walk(x); });
  })(s);
  return bits.join(' ').replace(/\s+/g,' ');
}
function runSearch(q){
  const box = $('#srchRes');
  if (!q.trim()){ box.innerHTML = '<div class="sr" style="color:var(--muted);cursor:default">Type to search titles, bullets, captions and speaker notes.</div>'; return; }
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig');
  const hits = [];
  DECK.slides.forEach((s,i)=>{
    const text = slideText(s);
    if (!rx.test(text)) return;
    rx.lastIndex = 0;
    const m = rx.exec(text); rx.lastIndex = 0;
    const at = Math.max(0, m.index - 60);
    const frag = (at?'…':'') + text.slice(at, m.index + 130) + '…';
    hits.push({ i, t:(s.title||'').replace(/<[^>]+>/g,''), c: frag.replace(rx, x=>'<mark>'+x+'</mark>') });
  });
  box.innerHTML = hits.length
    ? hits.map((h,k)=>`<div class="sr ${k===0?'on':''}" data-i="${h.i}"><div class="n">SLIDE ${String(h.i+1).padStart(2,'0')} · ${DECK.slides[h.i].sec||''}</div><div class="t">${h.t}</div><div class="c">${h.c}</div></div>`).join('')
    : '<div class="sr" style="color:var(--muted);cursor:default">No matches.</div>';
  $$('.sr[data-i]').forEach(n => n.onclick = () => { show(+n.dataset.i); closeAll(); });
}

/* ---------- lightbox with zoom & pan ---------- */
let lbList = [], lbAt = 0, lbZ = 1, lbX = 0, lbY = 0;
function lbApply(){ $('#lbImg').style.transform = `translate(calc(-50% + ${lbX}px), calc(-50% + ${lbY}px)) scale(${lbZ})`; }
function openLb(src){
  lbList = $$('.slide.active [data-img]').map(n => n.dataset.img);
  lbAt = Math.max(0, lbList.indexOf(src));
  lbShow();
  $('#lightbox').classList.add('open');
}
function lbShow(){
  const src = lbList[lbAt];
  $('#lbImg').src = U(src);
  lbZ = 1; lbX = 0; lbY = 0; lbApply();
  const fig = $$('.slide.active [data-img]').find(n => n.dataset.img === src);
  const cap = fig ? $('figcaption', fig) : null;
  $('#lbCap').innerHTML = (cap ? cap.innerHTML : '') + (lbList.length>1 ? ` <span style="opacity:.5;margin-left:10px">${lbAt+1} / ${lbList.length}</span>` : '');
}
$('#lbStage').addEventListener('wheel', e => { e.preventDefault(); lbZ = Math.min(8, Math.max(1, lbZ * (e.deltaY < 0 ? 1.14 : 0.88))); if (lbZ===1){lbX=0;lbY=0;} lbApply(); }, {passive:false});
(function(){
  let down=false, sx=0, sy=0;
  const st = $('#lbStage');
  st.addEventListener('pointerdown', e => { down=true; sx=e.clientX-lbX; sy=e.clientY-lbY; st.classList.add('drag'); st.setPointerCapture(e.pointerId); });
  st.addEventListener('pointermove', e => { if(!down) return; lbX=e.clientX-sx; lbY=e.clientY-sy; lbApply(); });
  st.addEventListener('pointerup', () => { down=false; st.classList.remove('drag'); });
})();
$('#lbZoomIn').onclick = () => { lbZ = Math.min(8, lbZ*1.3); lbApply(); };
$('#lbZoomOut').onclick = () => { lbZ = Math.max(1, lbZ/1.3); if(lbZ===1){lbX=0;lbY=0;} lbApply(); };
$('#lbReset').onclick = () => { lbZ=1; lbX=0; lbY=0; lbApply(); };
$('#lbPrev').onclick = () => { lbAt = (lbAt-1+lbList.length)%lbList.length; lbShow(); };
$('#lbNext').onclick = () => { lbAt = (lbAt+1)%lbList.length; lbShow(); };

/* ---------- per-slide widget wiring ---------- */
function wireSlides(){
  // figures -> lightbox
  $$('[data-img]', stage).forEach(n => n.onclick = () => {
    if (document.body.classList.contains('editing')) return;
    openLb(n.dataset.img);
  });
  // flip cards
  $$('[data-flip]', stage).forEach(n => n.onclick = () => {
    if (document.body.classList.contains('editing')) return;
    n.classList.toggle('on');
  });
  slides.forEach((el,i) => {
    const s = DECK.slides[i];
    if (s.layout === 'hotspot')  wireHotspot(el, s);
    if (s.layout === 'tree')     wireTree(el, s);
    if (s.layout === 'chooser')  wireChooser(el, s);
    if (s.layout === 'layers')   wireLayers(el, s);
    if (s.layout === 'compare')  wireCompare(el, s);
  });
}

function wireHotspot(el, s){
  const pick = i => {
    const sp = s.spots[i];
    $$('[data-spot]', el).forEach(n => n.classList.toggle('on', +n.dataset.spot === i));
    $('#spotChip', el).textContent = 'Site ' + sp.n;
    $('#spotTitle', el).textContent = sp.t;
    $('#spotBody', el).textContent = sp.d;
  };
  $$('[data-spot]', el).forEach(n => n.onclick = () => pick(+n.dataset.spot));
}

function wireLayers(el, s){
  const stack = $('#layerStack', el);
  $$('.layer', stack).forEach(n => n.onclick = () => {
    const on = n.classList.contains('on');
    $$('.layer', stack).forEach(m => m.classList.remove('on'));
    if (!on) n.classList.add('on');
  });
}

function wireCompare(el, s){
  const box = $('#cmpBox', el), top = $('.top', box), h = $('.handle', box);
  const set = p => { p = Math.max(0, Math.min(100, p)); top.style.clipPath = `inset(0 ${100-p}% 0 0)`; h.style.left = p+'%'; };
  let down = false;
  const at = e => { const r = box.getBoundingClientRect(); set((e.clientX - r.left) / r.width * 100); };
  box.addEventListener('pointerdown', e => { down = true; box.setPointerCapture(e.pointerId); at(e); });
  box.addEventListener('pointermove', e => { if (down) at(e); });
  box.addEventListener('pointerup', () => down = false);
  set(50);
}

/* ---------- repair selector logic ---------- */
function recommend(v){
  const highPressure = v.icp === 'high' || v.flow === 'high';
  const large = v.size === 'large';
  const mid = v.size === 'mid';
  let tag, tagK, layers, adjuncts, why;

  if (!highPressure && v.size === 'small' && v.flow === 'none'){
    tag = 'Single layer';
    layers = [
      ['Option A — simple mucosal graft','Overlay, mucosal surface facing the nasal cavity to prevent mucocele formation'],
      ['Option B — bath-plug technique','Fat plug the same diameter as the defect and 1.5–2 cm long, drawn into the defect on a 4/0 Vicryl suture, with mucosa slid over the top']
    ];
    adjuncts = ['Remove mucosa circumferentially ~5 mm from the defect edge','Tissue sealant → absorbable packing → non-absorbable packing'];
    why = 'Small defect, normal pressure and no active intra-operative leak — a single layer is reliable here, and over-engineering the repair adds donor-site morbidity for no gain.';
  } else if (!highPressure && (v.size === 'small' || mid)){
    tag = 'Two-layer';
    layers = [
      ['1st layer — underlay','Fascia or synthetic dural replacement, cut with an extra 1–2 cm border all round to allow for underlayering and shrinkage'],
      ['2nd layer — overlay','Free mucosal graft']
    ];
    adjuncts = ['Tissue sealant → absorbable packing → non-absorbable packing','Ethmoid roof takes an underlay; thin cribriform bone takes an overlay'];
    why = 'A low-flow leak through a defect under about 2 cm closes reliably with a multilayer free graft — over 90% of defects smaller than 1 cm² close without a vascularized flap.';
  } else if (!highPressure && large){
    tag = 'Three-layer + vascularized flap';
    layers = [
      ['1st layer — underlay','Fat, fascia or synthetic dural replacement'],
      ['2nd layer — underlay','Fascia or synthetic dural replacement'],
      ['3rd layer — overlay','± fat, followed by a vascularized pedicled mucosal flap — oversized for the defect']
    ];
    adjuncts = ['Tissue sealant → absorbable packing → non-absorbable packing','Nasoseptal flap is first choice where the septum is available'];
    why = 'Dural defects greater than 2 cm² are significantly more likely to leak post-operatively and benefit from the added support of vascularized tissue.';
  } else {
    tag = 'Six-layer construct';
    tagK = 'warn';
    layers = [
      ['1st — underlay','Fat, autograft fascia or synthetic dural replacement'],
      ['2nd — underlay','Fascia, synthetic dural replacement, or bone or cartilage graft'],
      ['3rd — overlay','± fat, followed by a vascularized pedicled mucosal flap'],
      ['4th','Tisseel glue'],
      ['5th','Absorbable packing — Gelfoam barrier between the reconstruction and the balloon'],
      ['6th','Non-absorbable packing — 16 F, 30 mL balloon Foley catheter']
    ];
    adjuncts = [
      'Autologous bone-cartilage grafts mitigate elevated ICP, at the cost of infection, extrusion and resorption risk',
      'Consider a lumbar drain — high-pressure, high-flow leaks and problematic reconstruction',
      'Plan post-operative ICP management: acetazolamide 250 mg QID, with shunting as an option'
    ];
    why = v.icp === 'high' && v.flow === 'high'
      ? 'High pressure and high flow together are the hardest combination — the construct needs rigid support, living vascularized tissue and mechanical bolstering, and the pressure itself must be treated.'
      : (v.icp === 'high'
        ? 'Raised intracranial pressure will test every layer of this repair. Add rigid support and a vascularized flap, and treat the pressure post-operatively or the leak returns.'
        : 'A high-flow intra-operative leak calls for vascularized reconstruction regardless of defect size — this is the setting where flaps clearly outperform free grafts.');
  }
  return { tag, tagK, layers, adjuncts, why, flap: /flap/i.test(tag) };
}

function wireChooser(el, s){
  const v = {}; (s.axes||[]).forEach(a => v[a.k] = a.opts[0].v);

      <div class="card-head" style="justify-content:space-between">

      </div>

        <div class="eyebrow" style="margin-bottom:10px"><span>Adjuncts</span></div>

/* keyboard */
addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'Escape'){ closeAll(); if (document.body.classList.contains('editing') && !typing) setEditing(false); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveLocal(); toast('Saved to this browser'); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (typing) return;
  if ($('#lightbox').classList.contains('open')){
    if (e.key === 'ArrowRight') $('#lbNext').click();
    if (e.key === 'ArrowLeft')  $('#lbPrev').click();
    return;
  }
  switch(e.key){
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': prev(); break;
    case 'Home': show(0); break;
    case 'End': show(slides.length-1); break;
    case 'o': case 'O': $('#btnOv').click(); break;

    case 'n': case 'N': $('#btnNotes').click(); break;
    case 'e': case 'E': $('#btnEdit').click(); break;
    case 'f': case 'F': $('#btnFull').click(); break;
    case 't': case 'T': $('#btnTimer').click(); break;
    case '/': e.preventDefault(); $('#btnSearch').click(); break;
    case '?': toast('← → navigate · O overview · C contents · / search · N notes · E editor · T timer · F fullscreen'); break;
  }
});

/* pointer navigation: click zones + swipe */
(function(){
  let sx = 0, sy = 0, t0 = 0;
  viewport.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; t0 = Date.now(); });
  viewport.addEventListener('pointerup', e => {
    const dx = e.clientX - sx, dy = e.clientY - sy, dt = Date.now() - t0;
    if (document.body.classList.contains('editing')) return;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.6 && dt < 700){ dx < 0 ? next() : prev(); return; }
    if (dt < 260 && Math.abs(dx) < 8 && Math.abs(dy) < 8){
      if (e.target.closest('a,button,video,[data-img],[data-flip],[data-spot],[data-opt],[data-crumb],.seg,.cmp,.layer,input,textarea,select')) return;
      const r = viewport.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      if (x > 0.72) next(); else if (x < 0.28) prev();
    }
  });
})();

let edOpen = false;

let hist = [], histAt = -1, histT = null;

const clone = o => JSON.parse(JSON.stringify(o));
function getPath(o, p){ return p.split('.').reduce((n,k) => (n==null?n:n[k]), o); }
function setPath(o, p, v){
  const ks = p.split('.'), last = ks.pop();
  const t = ks.reduce((n,k) => (n==null?n:n[k]), o);
  if (t) t[last] = v;
}
function snapshot(label){
  const state = { slides: clone(DECK.slides), meta: clone(DECK.meta), theme: clone(THEME) };
  hist = hist.slice(0, histAt+1);
  hist.push(state); if (hist.length > 60) hist.shift();
  histAt = hist.length-1;
}
function restore(st){
  DECK.slides = clone(st.slides); DECK.meta = clone(st.meta);
  THEME = clone(st.theme); applyTheme();
  mount(true); renderPanes(); saveLocal();
}
function undo(){ if (histAt > 0){ histAt--; restore(hist[histAt]); toast('Undo'); } else toast('Nothing to undo'); }
function redo(){ if (histAt < hist.length-1){ histAt++; restore(hist[histAt]); toast('Redo'); } else toast('Nothing to redo'); }

/* ---------- field helpers ---------- */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function bulletsToText(items){
  return (items||[]).map(it => {
    if (typeof it === 'string') return it;
    return it.t + (it.s ? '\n' + it.s.map(x => '- ' + x).join('\n') : '');
  }).join('\n\n');
}
function textToBullets(txt){
  const out = [];
  txt.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    if (t.startsWith('- ')){
      if (!out.length) out.push({ t:'' });
      const last = out[out.length-1];
      (last.s = last.s || []).push(t.slice(2).trim());
    } else out.push({ t });
  });
  return out;
}
function field(label, path, val, type){
  const id = 'f_'+path.replace(/\./g,'_');
  if (type === 'area')
    return `<div class="ed-sec"><label>${label}</label><textarea class="ed-ta" data-field="${path}" id="${id}">${esc(val)}</textarea></div>`;
  return `<div class="ed-sec"><label>${label}</label><input class="ed-in" data-field="${path}" id="${id}" value="${esc(val)}"></div>`;
}
function objList(label, key, arr, keys){
  return `<div class="ed-sec"><label>${label}</label><div class="ed-list">
    ${(arr||[]).map((o,i)=>`<div class="ed-item" style="flex-direction:column;align-items:stretch;gap:6px;cursor:default">
      <div style="display:flex;gap:8px;align-items:center"><span class="n">${i+1}</span>
        <div style="flex:1"></div>
        <button class="x" data-arr-del="${key}.${i}" title="Delete">✕</button></div>
      ${keys.map(k => k.t === 'area'
        ? `<textarea class="ed-ta" style="min-height:60px" data-field="${key}.${i}.${k.k}" placeholder="${k.l}">${esc(o[k.k])}</textarea>`
        : `<input class="ed-in" data-field="${key}.${i}.${k.k}" placeholder="${k.l}" value="${esc(o[k.k])}">`).join('')}
    </div>`).join('')}
  </div>
  <button class="ed-btn" data-arr-add="${key}" style="margin-top:8px">+ Add</button></div>`;
}

      <div class="ed-list" id="slideList">
        ${DECK.slides.map((s,i)=>`<div class="ed-item ${i===cur?'on':''}" draggable="true" data-si="${i}">

  $$('#slideList .ed-item').forEach(n => {
    n.onclick = e => { if (e.target.dataset.del !== undefined) return; show(+n.dataset.si); };
    n.ondragstart = e => e.dataTransfer.setData('text/plain', n.dataset.si);
    n.ondragover  = e => { e.preventDefault(); n.classList.add('drag-over'); };
    n.ondragleave = () => n.classList.remove('drag-over');
    n.ondrop = e => {
      e.preventDefault(); n.classList.remove('drag-over');
      const from = +e.dataTransfer.getData('text/plain'), to = +n.dataset.si;
      if (from === to) return;
      const [m] = DECK.slides.splice(from,1); DECK.slides.splice(to,0,m);
      snapshot(); mount(false); show(to); renderPanes(); saveLocal(); toast('Slide moved');
    };
  });
  $$('[data-del]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = +b.dataset.del;
    if (DECK.slides.length < 2) return toast('The deck needs at least one slide');
    DECK.slides.splice(i,1); snapshot(); mount(true); show(Math.min(i, DECK.slides.length-1)); renderPanes(); saveLocal(); toast('Slide deleted');
  });
  $('#addSlide').onclick = () => {
    const lay = $('#newLayout').value;
    DECK.slides.splice(cur+1, 0, blankSlide(lay, DECK.slides[cur].sec));
    snapshot(); mount(true); show(cur+1); renderPanes(); saveLocal(); toast('Slide added');
  };
  $('#dupSlide').onclick = () => {
    DECK.slides.splice(cur+1, 0, clone(DECK.slides[cur]));
    snapshot(); mount(true); show(cur+1); renderPanes(); saveLocal(); toast('Slide duplicated');
  };
  $('#delSlide').onclick = () => {

  };

/* Hand a generated file to the reader. A plain blob link works when the deck is
   opened as a file; a published page has no download permission of its own and
   must go through the viewer's save prompt instead. */
async function download(name, text, mime){
  const host = (typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function')
    ? await window.claude.use('downloads').catch(() => null) : null;
  if (host){
    try { await host.save({ filename: name, data: text }); toast('Saved ' + name); }
    catch(e){
      const code = e && e.code;
      if (code === 'declined')                toast('Save cancelled');
      else if (code === 'too_large')          toast('That file is too large to save from this page');
      else if (code === 'rate_limited')       toast('One save at a time — try again in a moment');
      else if (code === 'rejected_extension' || code === 'extension_not_enabled')
        toast('This viewer cannot save .' + name.split('.').pop() + ' files — export the deck as JSON instead');
      else                                    toast('Saving is not available in this view');
    }
    return;
  }
  const b = new Blob([text], { type: mime||'text/plain' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
}
function exportHtml(){
  const doc = document.documentElement.cloneNode(true);
  const st = doc.querySelector('#stage'); if (st) st.innerHTML = '';
  doc.querySelectorAll('.panel,.ov,.srch,.lb,.notes,.toast').forEach(n => {
    if (n.id === 'edPanel' || n.id === 'tocPanel') n.classList.remove('open');
    n.classList.remove('open');
  });
  const old = doc.querySelector('#deckOverride'); if (old) old.remove();
  const sc = doc.ownerDocument.createElement('script');
  sc.id = 'deckOverride';
  sc.textContent = `DECK.slides=${JSON.stringify(DECK.slides)};DECK.meta=${JSON.stringify(DECK.meta)};THEME=${JSON.stringify(THEME)};applyTheme();mount(false);`;
  doc.querySelector('body').appendChild(sc);
  download('csf-rhinorrhea-deck.html', '<!DOCTYPE html>\n' + doc.outerHTML, 'text/html');
}

/* ---------- persistence ---------- */
function saveLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({ meta:DECK.meta, theme:THEME, slides:DECK.slides })); } catch(e){}
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.slides || !d.slides.length) return false;
    DECK.slides = d.slides; if (d.meta) DECK.meta = d.meta; if (d.theme) THEME = d.theme;
    applyTheme(); return true;
  } catch(e){ return false; }
}

/* ---------- field binding ---------- */
function bindFields(root){
  $$('[data-field]', root).forEach(n => {
    const commit = () => {
      let v = n.value;
      if (/\.(x|y)$/.test(n.dataset.field) || n.dataset.field === 'hiCol') v = isNaN(+v) ? v : +v;
      setPath(DECK.slides[cur], n.dataset.field, v);
      mount(true); saveLocal();
    };
    n.onchange = () => { commit(); snapshot(); renderPanes(); };
    n.oninput  = () => { clearTimeout(histT); histT = setTimeout(() => { commit(); snapshot(); }, 500); };
  });
  $$('[data-bullets]', root).forEach(n => n.onchange = () => {
    setPath(DECK.slides[cur], n.dataset.bullets, textToBullets(n.value));
    snapshot(); mount(true); saveLocal();
  });
  $$('[data-lines]', root).forEach(n => n.onchange = () => {
    setPath(DECK.slides[cur], n.dataset.lines, n.value.split('\n').map(x=>x.trim()).filter(Boolean));
    snapshot(); mount(true); saveLocal();
  });
  $$('[data-table]', root).forEach(n => n.onchange = () => {
    const rows = n.value.split('\n').map(r => r.split('|').map(c => c.trim())).filter(r => r.length && r.join(''));
    const s = DECK.slides[cur];
    s.cols = rows.shift(); s.rows = rows;
    snapshot(); mount(true); renderPanes(); saveLocal();
  });
  $$('[data-arr-add]', root).forEach(b => b.onclick = () => {
    const key = b.dataset.arrAdd, s = DECK.slides[cur];
    const arr = getPath(s, key) || [];
    const proto = arr[0] ? clone(arr[0]) : {};
    Object.keys(proto).forEach(k => { if (typeof proto[k] === 'string' && k !== 'src' && k !== 'fit' && k !== 'ico') proto[k] = ''; });
    arr.push(proto); setPath(s, key, arr);
    snapshot(); mount(true); renderPanes(); saveLocal();
  });
  $$('[data-arr-del]', root).forEach(b => b.onclick = () => {
    const p = b.dataset.arrDel.split('.'), i = +p.pop(), key = p.join('.');
    const arr = getPath(DECK.slides[cur], key);
    if (arr && arr.length > 1){ arr.splice(i,1); snapshot(); mount(true); renderPanes(); saveLocal(); }
    else toast('Keep at least one item');
  });
  $$('[data-pick]', root).forEach(b => b.onclick = () => {
    pickTarget = b.dataset.pick;
    $$('.ed-tabs button').forEach(x => x.classList.toggle('on', x.dataset.pane === 'pFile'));
    $$('.ed-pane').forEach(p => p.classList.toggle('on', p.id === 'pFile'));
    toast('Now click an image in the library below');
  });
}
